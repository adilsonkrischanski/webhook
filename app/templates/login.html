{% extends 'base.html' %}{% block content %}<section class="login card"><p class="eyebrow">ÁREA ADMINISTRATIVA</p><h1>Suas integrações,<br>em um só lugar.</h1><p class="muted">Entre para gerenciar endpoints e acompanhar as chamadas recebidas.</p>{% if error %}<div class="notice error" role="alert">{{ error }}</div>{% endif %}<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Usuário<input name="username" autocomplete="username" required autofocus></label><label>Senha<input type="password" name="password" autocomplete="current-password" required></label><button class="primary wide">Entrar no painel →</button></form></section>{% endblock %}
